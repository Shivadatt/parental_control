# Parent Control — local Supabase CLI configuration.
# Nothing here deploys anything. These settings mirror the deployed project
# expectations documented in docs/backend.md.

project_id = "parentcontrol"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "parentcontrol://auth-callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "oneshot"

# User JWT verified by the gateway. Edge code still calls auth.getUser(token)
# and re-checks profile role, email verification and family membership.
[functions.auth-bootstrap]
verify_jwt = true

[functions.pairing]
verify_jwt = true

[functions.device-register]
verify_jwt = true

[functions.device-policy]
verify_jwt = true

[functions.family-admin]
verify_jwt = true

[functions.remote-session]
verify_jwt = true

# Account data export / deletion. User JWT required; the function also
# re-checks the caller's identity and family ownership in code.
[functions.account]
verify_jwt = true

# Mixed/device callers: self-authenticate inside the function.
# A publishable key is not a JWT, so the gateway must not try to verify it.
[functions.device-command]
verify_jwt = false

[functions.device-telemetry]
verify_jwt = false

# Scheduled caller: authenticated with the x-cron-secret header against the
# CRON_SECRET function secret, not with a user JWT.
[functions.cron]
verify_jwt = false
